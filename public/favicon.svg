<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#0d1117" rx="6"/>

  <!-- Subtle grid -->
  <line x1="8" y1="0" x2="8" y2="32" stroke="#161b22" stroke-width="0.5"/>
  <line x1="16" y1="0" x2="16" y2="32" stroke="#161b22" stroke-width="0.5"/>
  <line x1="24" y1="0" x2="24" y2="32" stroke="#161b22" stroke-width="0.5"/>
  <line x1="0" y1="8" x2="32" y2="8" stroke="#161b22" stroke-width="0.5"/>
  <line x1="0" y1="16" x2="32" y2="16" stroke="#161b22" stroke-width="0.5"/>
  <line x1="0" y1="24" x2="32" y2="24" stroke="#161b22" stroke-width="0.5"/>

  <!-- Corner brackets -->
  <polyline points="2,6 2,2 6,2" fill="none" stroke="#1f3a4a" stroke-width="1"/>
  <polyline points="26,2 30,2 30,6" fill="none" stroke="#1f3a4a" stroke-width="1"/>
  <polyline points="2,26 2,30 6,30" fill="none" stroke="#1f3a4a" stroke-width="1"/>
  <polyline points="30,26 30,30 26,30" fill="none" stroke="#1f3a4a" stroke-width="1"/>

  <!-- Glow layer -->
  <text x="16" y="21" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="13"
    text-anchor="middle" fill="#58a6ff" opacity="0.25" filter="url(#glow-wide)">J//</text>

  <!-- Sharp text -->
  <text x="16" y="21" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="13"
    text-anchor="middle" fill="#58a6ff">J//</text>

  <defs>
    <filter id="glow-wide" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
    </filter>
  </defs>
</svg>
